ApiError:
  type: object
  description: Objet d'erreur commun renvoyé par l'API.
  required:
    - code
    - message
  properties:
    code:
      type: string
      minLength: 1
      description: Code d'erreur stable, destiné au traitement côté client.
      example: validation_error
    message:
      type: string
      minLength: 1
      description: Message d'erreur lisible par un humain.
      example: The given data was invalid.
    details:
      type: object
      description: Détails structurés optionnels dépendant du type d'erreur.
      additionalProperties: true
  additionalProperties: false

ApiErrorEnvelope:
  type: object
  description: Enveloppe commune de toutes les réponses d'erreur.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      $ref: '#/ApiError'
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

ValidationErrorDetails:
  type: object
  description: Détail d'une erreur de validation par champ.
  required:
    - fields
  properties:
    fields:
      type: object
      description: |
        Mapping entre le nom logique du champ et une ou plusieurs erreurs de validation.
      additionalProperties:
        type: array
        minItems: 1
        items:
          type: string
  additionalProperties: false

ValidationErrorEnvelope:
  type: object
  description: Réponse d'erreur de validation HTTP 422.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          enum: [validation_error]
        message:
          type: string
          enum: [The given data was invalid.]
        details:
          $ref: '#/ValidationErrorDetails'
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

AuthenticationErrorEnvelope:
  type: object
  description: Réponse d'authentification absente ou invalide HTTP 401.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [authentication_error]
        message:
          type: string
          enum: [Authentication is required.]
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

AuthorizationErrorEnvelope:
  type: object
  description: Réponse d'autorisation refusée HTTP 403.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [authorization_error]
        message:
          type: string
          enum: [You are not allowed to perform this action.]
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

NotFoundErrorEnvelope:
  type: object
  description: Réponse de ressource introuvable HTTP 404.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [not_found]
        message:
          type: string
          enum: [Resource not found.]
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

HttpErrorEnvelope:
  type: object
  description: Réponse d'erreur HTTP générique non couverte par un cas spécifique.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [http_error]
        message:
          type: string
          minLength: 1
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false

ServerErrorEnvelope:
  type: object
  description: Réponse d'erreur inattendue HTTP 500.
  required:
    - success
    - error
    - meta
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum: [server_error]
        message:
          type: string
          enum: [An unexpected error occurred.]
      additionalProperties: false
    meta:
      $ref: ./common.yaml#/EnvelopeMeta
  additionalProperties: false
