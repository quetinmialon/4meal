name: ${COMPOSE_PROJECT_NAME:-4meal}

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_NAME: ${BACKEND_APP_NAME:-4meal Backend}
      APP_ENV: ${BACKEND_APP_ENV:-local}
      APP_KEY: ${BACKEND_APP_KEY:-base64:8CIYh4owmlLz9EJfpbkoC15zHfMkgfSr2FX2Dh6OW40=}
      APP_DEBUG: ${BACKEND_APP_DEBUG:-true}
      APP_URL: ${BACKEND_APP_URL:-http://localhost:${PROXY_PORT:-8080}}
      AUTH_EMAIL_VERIFICATION_URL: ${AUTH_EMAIL_VERIFICATION_URL:-http://localhost:${PROXY_PORT:-8080}}
      LOG_CHANNEL: ${BACKEND_LOG_CHANNEL:-stack}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-4meal}
      DB_USERNAME: ${POSTGRES_USER:-4meal}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SESSION_DRIVER: ${BACKEND_SESSION_DRIVER:-file}
      CACHE_STORE: ${BACKEND_CACHE_STORE:-file}
      QUEUE_CONNECTION: ${BACKEND_QUEUE_CONNECTION:-sync}
      BROADCAST_CONNECTION: ${BACKEND_BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-4meal-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-4meal-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-4meal-local-secret}
      REVERB_HOST: ${REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
      MAIL_MAILER: smtp
      MAIL_SCHEME: ""
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@4meal.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-4meal}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose:
      - "8000"
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - cookbook_images:/var/www/html/storage/app/public/cookbooks
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_NAME: ${BACKEND_APP_NAME:-4meal Backend}
      APP_ENV: ${BACKEND_APP_ENV:-local}
      APP_KEY: ${BACKEND_APP_KEY:-base64:8CIYh4owmlLz9EJfpbkoC15zHfMkgfSr2FX2Dh6OW40=}
      APP_DEBUG: ${BACKEND_APP_DEBUG:-true}
      BROADCAST_CONNECTION: ${BACKEND_BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-4meal-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-4meal-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-4meal-local-secret}
      REVERB_HOST: ${REVERB_HOST:-reverb}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REVERB_SERVER_HOST: ${REVERB_SERVER_HOST:-0.0.0.0}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8080}
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./backend:/var/www/html
      - ./.env:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: >-
      sh -c "if [ ! -f node_modules/.4meal-package-lock ] || ! cmp -s package-lock.json node_modules/.4meal-package-lock; then
      npm ci && cp package-lock.json node_modules/.4meal-package-lock;
      fi && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
      VITE_REALTIME_ENABLED: ${FRONTEND_REALTIME_ENABLED:-true}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-4meal-local-key}
      VITE_REVERB_HOST: ${FRONTEND_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${FRONTEND_REVERB_PORT:-8080}
      VITE_REVERB_SCHEME: ${FRONTEND_REVERB_SCHEME:-http}
      VITE_REVERB_AUTH_ENDPOINT: ${FRONTEND_REVERB_AUTH_ENDPOINT:-/api/broadcasting/auth}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - ./docs:/docs:ro
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-4meal}
      POSTGRES_USER: ${POSTGRES_USER:-4meal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  backend_storage:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
  cookbook_images:
 
