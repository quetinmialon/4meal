name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: 4meal_test
          POSTGRES_USER: 4meal_test
          POSTGRES_PASSWORD: 4meal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U 4meal_test -d 4meal_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: 4meal_test
      DB_USERNAME: 4meal_test
      DB_PASSWORD: 4meal_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, dom, fileinfo, pdo_pgsql
          coverage: none

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Ensure JWT secret is configured
        run: |
          # If APP_KEY was generated, copy it to JWT_SECRET so tests using JWT work
          APP_KEY=$(grep '^APP_KEY=' .env | cut -d'=' -f2-)
          if [ -z "$APP_KEY" ]; then
            php artisan key:generate --ansi
            APP_KEY=$(grep '^APP_KEY=' .env | cut -d'=' -f2-)
          fi
          echo "JWT_SECRET=$APP_KEY" >> .env

      - name: Migrate dedicated test database
        run: php artisan migrate --force

      - name: Run Pint
        run: composer pint -- --test

      - name: Run static analysis
        run: composer analyse

      - name: Run Pest
        run: composer test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean npm workspace
        run: sudo rm -rf node_modules
      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Vitest
        run: npm run test

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /tmp/docker-compose.resolved.yml

      - name: Validate dedicated test Compose stack
        run: docker compose -f docker-compose.test.yml config > /tmp/docker-compose-test.resolved.yml

  e2e:
    name: End-to-end critical flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the application stack
        run: |
          cp .env.docker.example .env
          docker compose --env-file .env -f docker-compose.yml up --build -d
          until curl --fail --silent http://127.0.0.1:8080/up > /dev/null; do sleep 3; done
          docker compose --env-file .env -f docker-compose.yml exec -T backend php artisan migrate --force
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          sudo rm -rf node_modules
          npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run critical E2E flows
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Stop the application stack
        if: always()
        run: docker compose --env-file .env -f docker-compose.yml down -v
